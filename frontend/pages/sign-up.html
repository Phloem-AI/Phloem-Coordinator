<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.jpg" />
  <title>Sign Up for Phloem AI Early Access</title>
  <link rel="canonical" href="https://phloem-ai.netlify.app/pages/sign-up.html" />
    
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1DRVC1WTR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());

    gtag('config', 'G-W1DRVC1WTR');
  </script>

  <meta name="description" content="Sign up for Phloem AI early access." />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { background: #000; color: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    .page-shell { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 4rem; }
    .hero { min-height: 80vh; display:flex; align-items:center; justify-content:center; }
    .container { width:100%; text-align:center; padding:3.5rem 2rem; border:1px solid #333; background:#000; }
    .logo { display:inline-block; border:1px solid rgba(255,255,255,.22); padding:.45rem .8rem; font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; margin-bottom:1.7rem; color:rgba(255,255,255,.75); border-radius:999px; }
    h1 { font-size:2.4rem; font-weight:700; margin-bottom:1rem; }
    p.lead { color: rgba(255,255,255,.72); margin-bottom:1.25rem; }

    form { display:flex; flex-direction:column; gap:0.75rem; align-items:stretch; max-width:420px; margin: 0.5rem auto 0; }
    input[type=email], input[type=password] { background:#000; color:#fff; border:1px solid #444; padding:12px 14px; font-size:1rem; }
    .terms-checkbox { display:flex; align-items:flex-start; gap:.65rem; color:rgba(255,255,255,.65); font-size:.85rem; line-height:1.5; text-align:left; }
    .terms-checkbox input { width:1rem; height:1rem; margin-top:.2rem; accent-color:#fff; flex-shrink:0; }
    .terms-checkbox a { color:rgba(255,255,255,.92); text-decoration:underline; text-underline-offset:3px; }
    .terms-checkbox a:hover, .terms-checkbox a:focus-visible { color:#fff; }
    .btn { padding:.95rem 1.5rem; text-decoration:none; border:1px solid #444; transition: background .2s ease, color .2s ease; font-size:.95rem; cursor:pointer; background:transparent; color:#fff; }
    .btn-primary { background:#fff; color:#000; border-color:#fff; }
    .btn-primary:hover { background:transparent; color:#fff; }
    .muted { color: rgba(255,255,255,.6); font-size:.95rem; }
    .link { color: inherit; text-decoration:underline; cursor:pointer; }
    #status { margin-top:1rem; color: rgba(255,255,255,.8); min-height:1.4rem; }
    .hidden { display:none; }
    a.home { display:inline-block; margin-top:1rem; color:rgba(255,255,255,.65); }
    ::selection {
        background: #fff;
        color: #000;
    }
    footer {
      margin-top: 2.2rem;
      color: rgba(255,255,255,.35);
      font-size: .8rem;
      text-align: center;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .footer-legal-links {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: .65rem;
        letter-spacing: .08em;
        text-transform: none;
    }

    .footer-legal-links a {
        color: rgba(255,255,255,.5);
        text-decoration: none;
        transition: color .2s ease;
    }

    .footer-legal-links a:hover,
    .footer-legal-links a:focus-visible {
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 3px;
    }


    @media (max-width:700px){ .container{ padding:2rem 1.5rem; border-radius:20px; } input[type=email], input[type=password]{ font-size:1rem; } }
  </style>
</head>

<body>
  <div class="page-shell">
    <section class="hero">
      <main class="container">
        <div class="logo">Offering Early Access</div>

        <div id="signup-panel" class="hidden">
        <h1>Get started with Phloem</h1>
        <p class="lead">Create an account to join the waitlist and access early features.</p>

          <form id="signup-form">
            <input id="signup-email" type="email" placeholder="you@example.com" required />
            <input id="signup-password" type="password" placeholder="Choose a password" required minlength="6" />
            <label class="terms-checkbox" for="terms-agreement">
              <input id="terms-agreement" type="checkbox" required />
              <span>I agree to the <a href="./terms-of-service.html" target="_blank" rel="noopener noreferrer">Terms of Use</a> and <a href="./privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</span>
            </label>
            <button id="signup-btn" class="btn btn-primary" type="submit">Create account</button>
          </form>

          <div class="muted" style="margin-top:.75rem">
            Already have an account? <span id="show-login" class="link">Log in</span>
          </div>
        </div>

        <div id="login-panel">
        <h1>Sign in to Phloem</h1>

          <form id="login-form">
            <input id="login-email" type="email" placeholder="you@example.com" required />
            <input id="login-password" type="password" placeholder="Your password" required />
            <button id="login-btn" class="btn btn-primary" type="submit">Log in</button>
          </form>

          <div class="muted" style="margin-top:.75rem">
            New here? <span id="show-signup" class="link">Create an account</span>
          </div>
        </div>

        <div id="status" role="status" aria-live="polite"></div>

        <a class="home" href="../index.html">← Back to home</a>
      </main>
    </section>

    <footer>© 2026 • Phloem AI</footer>
    <footer>Contact • <a href="mailto:qasimhassan1947@gmail.com" target="_blank" rel="noopener noreferrer" style="color: inherit;">Email</a></footer>
    <nav class="footer-legal-links" aria-label="Legal">
      <a href="./terms-of-service.html">Terms of Service</a>
      <span aria-hidden="true">•</span>
      <a href="./privacy-policy.html">Privacy Policy</a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/../assets/supabase.js"></script>
  <script>
    const supabase_cl = getSupabaseClient();

    const checkSession = async () => {
      if (!supabase_cl) return;
      const { data } = await supabase_cl.auth.getSession();

      if (data.session) {
        window.location.href = "./connect.html";
      }
    };

    checkSession();

    function setStatus(msg) { document.getElementById('status').innerText = msg; }

    function showPanel(panel) {
      document.getElementById('signup-panel').classList.toggle('hidden', panel !== 'signup');
      document.getElementById('login-panel').classList.toggle('hidden', panel !== 'login');
      setStatus('');
    }

    document.getElementById('show-login').addEventListener('click', () => showPanel('login'));
    document.getElementById('show-signup').addEventListener('click', () => showPanel('signup'));

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;

      if (!email || !password) { setStatus('Please provide email and password.'); return; }
      if (!supabase_cl) { setStatus('Supabase is not configured.'); return; }

      setStatus('Creating account...');
      document.getElementById('signup-btn').disabled = true;

      try {
        const { data, error } = await supabase_cl.auth.signUp({ email, password });
        if (error) throw error;
        setStatus("Account created!");
        document.getElementById('signup-form').reset();
      } catch (err) {
        setStatus("Unable to create account.");
      } finally {
        document.getElementById('signup-btn').disabled = false;
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) { setStatus('Please provide email and password.'); return; }
      if (!supabase_cl) { setStatus('Supabase is not configured.'); return; }

      setStatus('Signing in...');
      document.getElementById('login-btn').disabled = true;

      try {
        const { data, error } = await supabase_cl.auth.signInWithPassword({ email, password });
        if (error) throw error;
        setStatus('Signed in successfully.');
        document.getElementById('login-form').reset();
        window.location.href = "./connect.html";
      } catch (err) {
        setStatus('Unable to sign in.');
      } finally {
        document.getElementById('login-btn').disabled = false;
      }
    });
  </script>
</body>
</html>
